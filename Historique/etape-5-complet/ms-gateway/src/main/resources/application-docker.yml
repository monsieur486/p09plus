# Passerelle, configuration destinée aux conteneurs : les services sont joints par leur
# nom de service Docker plutôt que par localhost.

spring:
  config:
    # Charge le fichier .env s'il est présent ; son absence n'empêche pas le démarrage.
    import: optional:file:.env[.properties]

  application:
    # Nom logique du service, affiché dans les journaux et le registre.
    name: ms-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              # Crée automatiquement une route par service enregistré : aucune route à écrire.
              enabled: true
              # Les noms de services étant en minuscules, les URL le sont aussi.
              lower-case-service-id: true
              filters:
                - name: StripPrefix
                  args:
                    # Retire le premier segment (le nom du service) avant de transmettre.
                    parts: 1

server:
  # Port d'écoute de la passerelle, seul port d'API exposé aux clients.
  port: 9000

management:
  endpoints:
    web:
      exposure:
        # Ajoute l'inventaire des routes à la supervision, utile pour diagnostiquer le routage.
        include: health,info,gateway

eureka:
  client:
    service-url:
      # Adresse du registre, joint par son nom de service Docker.
      defaultZone: http://ms-eureka:8761/eureka
    # La passerelle se déclare pour être visible des autres services.
    registerWithEureka: true
    # Elle récupère le catalogue : c'est lui qui alimente le routage automatique.
    fetchRegistry: true
