# Registre de services.
#
# Une seule instance : le registre est l'annuaire où tous les autres services se déclarent,
# et le projet n'en met pas en place la réplication. C'est aussi le premier objet à être
# prêt — sans lui, la passerelle n'a aucun catalogue à router.
apiVersion: v1
kind: Service
metadata:
  name: ms-eureka
  labels:
    app.kubernetes.io/name: ms-eureka
    app.kubernetes.io/part-of: p09plus
spec:
  selector:
    app.kubernetes.io/name: ms-eureka
  ports:
    - name: http
      port: 8761
      targetPort: 8761
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-eureka
  labels:
    app.kubernetes.io/name: ms-eureka
    app.kubernetes.io/part-of: p09plus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ms-eureka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ms-eureka
        app.kubernetes.io/part-of: p09plus
    spec:
      containers:
        - name: ms-eureka
          # Image construite dans le démon de minikube par k8s-start.sh ; Never empêche
          # Kubernetes d'aller la chercher sur un registre distant, où elle n'existe pas.
          image: p09plus/ms-eureka:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8761
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            # Sans consigne, la JVM dimensionne son tas sur la mémoire du nœud et ignore la
            # limite du conteneur : elle se ferait tuer pour dépassement. Le ramasse-miettes
            # série coûte moins de mémoire et de fils qu'un G1 sur un si petit tas.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC"
          # Actuator n'expose que health et info, et les laisse en accès libre : les sondes
          # l'interrogent donc sans authentification. Spring Boot, détectant Kubernetes,
          # y ajoute deux groupes distincts. La readiness
          # tient compte des dépendances (base, registre) : un pod qui les perd sort du
          # Service sans être tué.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
          # La liveness ne juge que l'application elle-même : sans cette distinction, une
          # base momentanément indisponible ferait redémarrer en cascade tous ses clients.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 15
