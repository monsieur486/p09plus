# Passerelle : point d'entrée unique des API.
#
# Aucune route n'est déclarée ici non plus qu'en configuration : la passerelle interroge le
# registre et construit ses routes à partir des noms des services enregistrés. Renommer un
# Service Kubernetes ne suffirait donc pas à casser le routage — c'est le
# spring.application.name des microservices qui compte.
apiVersion: v1
kind: Service
metadata:
  name: ms-gateway
  labels:
    app.kubernetes.io/name: ms-gateway
    app.kubernetes.io/part-of: p09plus
spec:
  selector:
    app.kubernetes.io/name: ms-gateway
  ports:
    - name: http
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-gateway
  labels:
    app.kubernetes.io/name: ms-gateway
    app.kubernetes.io/part-of: p09plus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ms-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ms-gateway
        app.kubernetes.io/part-of: p09plus
    spec:
      containers:
        - name: ms-gateway
          image: p09plus/ms-gateway:local
          imagePullPolicy: Never
          ports:
            - containerPort: 9000
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            # Sans consigne, la JVM dimensionne son tas sur la mémoire du nœud et ignore la
            # limite du conteneur : elle se ferait tuer pour dépassement. Le ramasse-miettes
            # série coûte moins de mémoire et de fils qu'un G1 sur un si petit tas.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC"
          # Spring Boot détecte Kubernetes et expose deux groupes distincts. La readiness
          # tient compte des dépendances (base, registre) : un pod qui les perd sort du
          # Service sans être tué.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
          # La liveness ne juge que l'application elle-même : sans cette distinction, une
          # base momentanément indisponible ferait redémarrer en cascade tous ses clients.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 15
