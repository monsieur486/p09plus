# Identifiants de la pile, équivalent Kubernetes du fichier .env de Docker Compose.
#
# Les valeurs sont celles de dist.env : des identifiants de développement, versionnés
# pour que la pile démarre sans préparation. Un déploiement réel remplacerait ce fichier
# par un secret créé hors du dépôt (kubectl create secret, ou un gestionnaire externe).
#
# stringData accepte le texte clair ; Kubernetes se charge de l'encodage base64. Écrire
# les valeurs déjà encodées n'apporterait aucune confidentialité et rendrait le fichier
# illisible en revue.
apiVersion: v1
kind: Secret
metadata:
  name: p09plus-secrets
  labels:
    app.kubernetes.io/part-of: p09plus
type: Opaque
stringData:
  # Identifiants applicatifs, partagés par les quatre services et l'interface web.
  APP_USERNAME: app_user
  APP_PASSWORD: app_password

  # Base PostgreSQL des fiches patients.
  POSTGRES_DB: patientsdb
  POSTGRES_USER: patient_user
  POSTGRES_PASSWORD: patient_pass

  # Base MongoDB des notes de consultation.
  MONGO_INITDB_ROOT_USERNAME: notes_user
  MONGO_INITDB_ROOT_PASSWORD: notes_password
