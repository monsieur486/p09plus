services:

  ms-eureka:
    build:
      # Contexte à la racine : le module hérite du pom parent et dépend de ms-commun.
      context: .
      dockerfile: ms-eureka/Dockerfile
    container_name: ms-eureka
    profiles: ["fullstack"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8761:8761"

  ms-gateway:
    build:
      # Contexte à la racine : le module hérite du pom parent et dépend de ms-commun.
      context: .
      dockerfile: ms-gateway/Dockerfile
    container_name: ms-gateway
    profiles: ["fullstack"]
    depends_on:
      - ms-eureka
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "9000:9000"

  patients-db:
    image: postgres:16
    container_name: patients-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patientsdb}
      POSTGRES_USER: ${POSTGRES_USER:-patient_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patient_pass}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  notes-db:
    image: mongo:8.0.14
    container_name: notes-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-notes_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-notes_password}
    ports:
      - "27017:27017"
    volumes:
      - database-data:/data/db

  # Applique les migrations Liquibase une fois pour toutes, puis s'arrête. Sans ce
  # préalable, plusieurs instances lancées ensemble sur une base vierge créent la table
  # d'historique en même temps et l'une d'elles échoue au démarrage.
  ms-patients-migration:
    build:
      # Contexte à la racine : le module hérite du pom parent et dépend de ms-commun.
      context: .
      dockerfile: ms-patients/Dockerfile
    profiles: ["fullstack"]
    depends_on:
      - patients-db
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Ni serveur web ni enregistrement au registre : le conteneur migre et rend la main.
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      EUREKA_CLIENT_ENABLED: "false"
      APP_USERNAME: ${APP_USERNAME:-app_user}
      APP_PASSWORD: ${APP_PASSWORD:-app_password}
    restart: "no"

  ms-patients:
    build:
      # Contexte à la racine : le module hérite du pom parent et dépend de ms-commun.
      context: .
      dockerfile: ms-patients/Dockerfile
    profiles: ["fullstack"]
    # Nombre d'instances, lu dans le .env par Docker Compose.
    deploy:
      replicas: ${REPLICA_MS_PATIENTS:-2}
    depends_on:
      ms-eureka:
        condition: service_started
      ms-gateway:
        condition: service_started
      # Le schéma est déjà en place quand les instances démarrent.
      ms-patients-migration:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_USERNAME: ${APP_USERNAME:-app_user}
      APP_PASSWORD: ${APP_PASSWORD:-app_password}

  ms-notes:
    build:
      # Contexte à la racine : le module hérite du pom parent et dépend de ms-commun.
      context: .
      dockerfile: ms-notes/Dockerfile
    profiles: ["fullstack"]
    # Nombre d'instances, lu dans le .env par Docker Compose.
    deploy:
      replicas: ${REPLICA_MS_NOTES:-2}
    depends_on:
      - ms-eureka
      - notes-db
      - ms-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_USERNAME: ${APP_USERNAME:-app_user}
      APP_PASSWORD: ${APP_PASSWORD:-app_password}

  ms-risque:
    build:
      # Contexte à la racine : le module hérite du pom parent et dépend de ms-commun.
      context: .
      dockerfile: ms-risque/Dockerfile
    profiles: ["fullstack"]
    # Nombre d'instances, lu dans le .env par Docker Compose.
    deploy:
      replicas: ${REPLICA_MS_RISQUE:-2}
    depends_on:
      - ms-eureka
      - ms-gateway
      - ms-patients
      - ms-notes
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_USERNAME: ${APP_USERNAME:-app_user}
      APP_PASSWORD: ${APP_PASSWORD:-app_password}

  ms-webclient:
    build:
      # Contexte à la racine : le module hérite du pom parent et dépend de ms-commun.
      context: .
      dockerfile: ms-webclient/Dockerfile
    profiles: ["fullstack"]
    container_name: ms-webclient
    depends_on:
      - ms-patients
      - ms-notes
      - ms-risque
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_USERNAME: ${APP_USERNAME:-app_user}
      APP_PASSWORD: ${APP_PASSWORD:-app_password}
    ports:
      - "${PORT_WEBCLIENT:-8080}:8080"

volumes:
  db_data:
  database-data:
