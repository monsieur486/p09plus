# Base MongoDB des notes de consultation.
#
# Même raisonnement que pour PostgreSQL : StatefulSet, volume réclamé par le gabarit, et
# Service nommé comme dans Docker Compose. Aucun préalable de migration ici — Mongock pose
# un verrou, plusieurs instances de ms-notes peuvent donc démarrer ensemble sans se
# disputer le changelog.
apiVersion: v1
kind: Service
metadata:
  name: notes-db
  labels:
    app.kubernetes.io/name: notes-db
    app.kubernetes.io/part-of: p09plus
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: notes-db
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: notes-db
  labels:
    app.kubernetes.io/name: notes-db
    app.kubernetes.io/part-of: p09plus
spec:
  serviceName: notes-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notes-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notes-db
        app.kubernetes.io/part-of: p09plus
    spec:
      containers:
        - name: mongo
          image: mongo:8.0.14
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          envFrom:
            - secretRef:
                name: p09plus-secrets
          # La commande ping du shell mongosh confirme que le serveur répond aux requêtes,
          # et pas seulement que le processus est lancé.
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
            # mongosh est un client Node : son démarrage dépasse la seconde accordée par
            # défaut, et la base passerait pour morte alors qu'elle répond.
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: donnees
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: donnees
        # Les réclamations nées d'un gabarit n'héritent pas des étiquettes du pod : sans
        # celles-ci, le --purge de k8s-stop.sh ne saurait pas lesquelles supprimer.
        labels:
          app.kubernetes.io/name: notes-db
          app.kubernetes.io/part-of: p09plus
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
