services:

  ms-eureka:
    build:
      context: .
      dockerfile: ms-eureka/Dockerfile
    container_name: ms-eureka
    profiles: ["fullstack"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8761:8761"

  ms-gateway:
    build:
      context: .
      dockerfile: ms-gateway/Dockerfile
    container_name: ms-gateway
    profiles: ["fullstack"]
    depends_on:
      - ms-eureka
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "9000:9000"

  patients-db:
    image: postgres:16
    container_name: patients-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patientsdb}
      POSTGRES_USER: ${POSTGRES_USER:-patient_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patient_pass}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  ms-patients-migration:
    build:
      context: .
      dockerfile: ms-patients/Dockerfile
    profiles: ["fullstack"]
    depends_on:
      - patients-db
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      EUREKA_CLIENT_ENABLED: "false"
      APP_USERNAME: ${APP_USERNAME:-app_user}
      APP_PASSWORD: ${APP_PASSWORD:-app_password}
    restart: "no"

  ms-patients:
    build:
      context: .
      dockerfile: ms-patients/Dockerfile
    profiles: ["fullstack"]
    deploy:
      replicas: ${REPLICA_MS_PATIENTS:-2}
    depends_on:
      ms-eureka:
        condition: service_started
      ms-gateway:
        condition: service_started
      ms-patients-migration:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_USERNAME: ${APP_USERNAME:-app_user}
      APP_PASSWORD: ${APP_PASSWORD:-app_password}

  ms-webclient:
    build:
      context: .
      dockerfile: ms-webclient/Dockerfile
    profiles: ["fullstack"]
    container_name: ms-webclient
    depends_on:
      - ms-patients
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_USERNAME: ${APP_USERNAME:-app_user}
      APP_PASSWORD: ${APP_PASSWORD:-app_password}
    ports:
      - "${PORT_WEBCLIENT:-8080}:8080"

volumes:
  db_data:
  database-data:
