# Notes de consultation — deux instances.
#
# Pas d'attente préalable ici, contrairement à ms-patients : Mongock pose un verrou avant
# d'exécuter ses migrations, les instances peuvent donc démarrer ensemble sur une base
# vierge sans se disputer le changelog. C'est ce verrou qui rend la réplication possible
# sans autre précaution.
apiVersion: v1
kind: Service
metadata:
  name: ms-notes
  labels:
    app.kubernetes.io/name: ms-notes
    app.kubernetes.io/part-of: p09plus
spec:
  selector:
    app.kubernetes.io/name: ms-notes
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-notes
  labels:
    app.kubernetes.io/name: ms-notes
    app.kubernetes.io/part-of: p09plus
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ms-notes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ms-notes
        app.kubernetes.io/part-of: p09plus
    spec:
      containers:
        - name: ms-notes
          image: p09plus/ms-notes:local
          imagePullPolicy: Never
          ports:
            - containerPort: 9200
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            # Sans consigne, la JVM dimensionne son tas sur la mémoire du nœud et ignore la
            # limite du conteneur : elle se ferait tuer pour dépassement. Le ramasse-miettes
            # série coûte moins de mémoire et de fils qu'un G1 sur un si petit tas.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC"
          envFrom:
            - secretRef:
                name: p09plus-secrets
          # Spring Boot détecte Kubernetes et expose deux groupes distincts. La readiness
          # tient compte des dépendances (base, registre) : un pod qui les perd sort du
          # Service sans être tué.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
          # La liveness ne juge que l'application elle-même : sans cette distinction, une
          # base momentanément indisponible ferait redémarrer en cascade tous ses clients.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 15
